<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Android ADB WebUSB</title>
  <link rel="stylesheet" href="./vendor/xterm.css">
  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#6f7b91; --line:#e6eaf0; --brand:#16a34a; --soft:#effcf3; --danger:#b42318; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:#f6f8fc; color:var(--ink); font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(1180px, calc(100% - 32px)); margin:0 auto; padding:52px 0 72px; }
    .back { color:var(--brand); text-decoration:none; font-weight:700; }
    h1 { margin:18px 0 8px; font-size:clamp(28px, 5vw, 44px); line-height:1.1; letter-spacing:-.04em; }
    .intro { max-width:760px; margin:0; color:var(--muted); font-size:16px; }
    .panel { overflow:hidden; border:1px solid var(--line); border-radius:20px; background:#fff; box-shadow:0 12px 40px rgba(25,42,80,.07); }
    .connection { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:22px; border-bottom:1px solid var(--line); }
    button { border:0; border-radius:10px; padding:10px 16px; color:#fff; background:var(--brand); cursor:pointer; font:inherit; font-weight:700; }
    button.secondary { color:var(--ink); background:#eef1f5; }
    button:disabled { opacity:.55; cursor:wait; }
    .status { color:var(--muted); }
    .notice { padding:14px 22px; color:var(--muted); background:var(--soft); font-size:13px; }
    .tabs { display:flex; gap:8px; padding:18px 22px 0; border-bottom:1px solid var(--line); }
    .tab { margin-bottom:-1px; color:var(--muted); background:transparent; border:1px solid transparent; border-bottom:2px solid transparent; border-radius:0; }
    .tab.active { color:var(--brand); background:#fff; border-color:var(--line); border-bottom-color:var(--brand); }
    .view { padding:22px; }
    .toolbar { display:flex; gap:10px; margin-bottom:14px; }
    .pathbar { display:flex; gap:8px; align-items:center; margin-bottom:14px; color:var(--muted); font-size:13px; }
    .pathbar button { padding:7px 11px; }
    .file-list { overflow:auto; border:1px solid var(--line); border-radius:10px; }
    .file-row { display:grid; grid-template-columns:minmax(0,1fr) 120px 180px 80px 120px; gap:12px; align-items:center; padding:11px 14px; border-bottom:1px solid var(--line); }
    .file-row:last-child { border-bottom:0; }
    .file-row.header { color:var(--muted); background:#fafbfe; font-size:12px; font-weight:700; }
    .file-name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .file-link { padding:0; overflow:hidden; color:var(--brand); background:none; text-align:left; text-overflow:ellipsis; white-space:nowrap; }
    .file-link:hover { text-decoration:underline; }
    .file-action { padding:5px 9px; font-size:12px; }
    .file-actions { display:flex; gap:5px; }
    .file-preview { padding:18px; text-align:center; }
    .file-preview img, .file-preview iframe { max-width:100%; border:0; border-radius:8px; }
    .file-preview img { max-height:620px; object-fit:contain; }
    .file-preview iframe { width:100%; height:680px; }
    .file-preview audio, .file-preview video { max-width:100%; }
    input { min-width:0; flex:1; border:1px solid var(--line); border-radius:10px; padding:10px 12px; color:var(--ink); font:inherit; }
    pre { min-height:320px; margin:0; padding:16px; overflow:auto; border-radius:10px; color:#d1fae5; background:#172033; font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap; word-break:break-word; }
    .terminal-input { display:flex; gap:10px; margin-top:12px; }
    .terminal-screen { min-height:420px; padding:12px; overflow:hidden; border-radius:10px; background:#111827; }
    .screen-toolbar { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
    .screen-output { min-height:420px; display:grid; place-items:center; overflow:hidden; border-radius:10px; background:#111827; color:#94a3b8; touch-action:none; }
    .screen-output canvas { display:block; max-width:100%; max-height:760px; }
    .terminal-size { display:flex; align-items:center; gap:10px; margin-bottom:10px; color:var(--muted); font-size:13px; }
    .terminal-size input { flex:0 1 220px; padding:0; accent-color:var(--brand); }
    .debug { margin-top:18px; border-top:1px solid var(--line); padding-top:16px; }
    .debug-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; color:var(--muted); font-size:13px; font-weight:700; }
    .debug-head button { padding:5px 10px; color:var(--muted); background:#eef1f5; font-size:12px; }
    .debug pre { min-height:100px; max-height:260px; color:#cbd5e1; background:#111827; font-size:12px; }
    .empty { min-height:320px; display:grid; place-items:center; color:var(--muted); text-align:center; }
    .error { color:var(--danger); }
    [hidden] { display:none !important; }
    @media (max-width:600px) { main { width:min(100% - 20px, 1180px); padding-top:30px; } .toolbar, .terminal-input { flex-direction:column; } }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../index.html">← 返回工具首页</a>
    <h1>Android ADB WebUSB</h1>
    <p class="intro">使用 Chrome / Edge 通过 WebUSB 连接开启 USB 调试的 Android 设备。文件浏览器和命令终端相互独立。</p>
    <section class="panel">
      <div class="connection">
        <button id="connectButton" type="button">连接 Android 设备</button>
        <button id="disconnectButton" class="secondary" type="button" disabled>断开</button>
        <span id="status" class="status">未连接</span>
      </div>
      <div class="notice">要求 HTTPS 或 localhost、Chrome / Edge，并开启 USB 调试。首次连接时手机可能弹出授权提示；已经授权的设备不会重复弹窗。连接前请关闭电脑上的 adb server、Android Studio 或 scrcpy。</div>
      <div class="tabs" role="tablist" aria-label="ADB 工具">
        <button class="tab active" data-view="files" role="tab" aria-selected="true">文件浏览器</button>
        <button class="tab" data-view="terminal" role="tab" aria-selected="false">命令终端</button>
        <button class="tab" data-view="screen" role="tab" aria-selected="false">投屏</button>
      </div>
      <section id="filesView" class="view">
        <div class="toolbar"><input id="pathInput" value="/sdcard" placeholder="设备路径，例如 /sdcard"><button id="listButton" type="button" disabled>列出文件</button></div>
        <div class="pathbar"><button id="upButton" class="secondary" type="button" disabled>↑ 返回上级</button><span id="currentPath">/sdcard</span></div>
        <div id="fileOutput" class="empty">连接设备后列出目录</div>
      </section>
      <section id="terminalView" class="view" hidden>
        <div class="terminal-size"><span>终端高度</span><input id="terminalHeight" type="range" min="240" max="2000" step="10" value="420"><span id="terminalHeightValue">420px</span></div>
        <div id="terminalOutput" class="terminal-screen"><div class="empty">连接设备后启动终端</div></div>
      </section>
      <section id="screenView" class="view" hidden>
        <div class="screen-toolbar"><button id="screenButton" type="button" disabled>开始投屏</button><span id="screenStatus" class="status">连接设备后开始投屏</span></div>
        <div id="screenOutput" class="screen-output">投屏画面会显示在这里</div>
      </section>
      <section class="view debug">
        <div class="debug-head"><span>调试日志</span><button id="clearLogButton" type="button">清空</button></div>
        <pre id="debugLog">等待操作…</pre>
      </section>
    </section>
  </main>

  <script>
    window.addEventListener('error', event => {
      const status = document.querySelector('#status');
      if (status && event.message) { status.textContent = `页面脚本加载失败：${event.message}`; status.classList.add('error'); }
    });
    window.addEventListener('unhandledrejection', event => {
      const status = document.querySelector('#status');
      if (status && event.reason) { status.textContent = `页面模块加载失败：${event.reason.message || event.reason}`; status.classList.add('error'); }
    });
  </script>
  <script src="./vendor/xterm.js"></script>
  <script src="./vendor/xterm-addon-fit.js"></script>
  <script type="module">
    import { Adb, AdbDaemonTransport } from './vendor/adb.js';
    import AdbWebCredentialStore from './vendor/adb-credential-web.js';
    import { AdbDaemonWebUsbDeviceManager } from './vendor/adb-daemon-webusb.js';

    const connectButton = document.querySelector('#connectButton');
    const disconnectButton = document.querySelector('#disconnectButton');
    const status = document.querySelector('#status');
    const pathInput = document.querySelector('#pathInput');
    const listButton = document.querySelector('#listButton');
    const fileOutput = document.querySelector('#fileOutput');
    const upButton = document.querySelector('#upButton');
    const currentPath = document.querySelector('#currentPath');
    const terminalOutput = document.querySelector('#terminalOutput');
    const terminalHeight = document.querySelector('#terminalHeight');
    const terminalHeightValue = document.querySelector('#terminalHeightValue');
    const debugLog = document.querySelector('#debugLog');
    const clearLogButton = document.querySelector('#clearLogButton');
    const screenButton = document.querySelector('#screenButton');
    const screenStatus = document.querySelector('#screenStatus');
    const screenOutput = document.querySelector('#screenOutput');
    const tabs = document.querySelectorAll('.tab');
    let adb;
    let backend;
    let previewUrl;
    let terminal;
    let terminalProcess;
    let terminalWriter;
    let fitAddon;
    let scrcpyClient;
    let screenDecoder;
    let screenVideoWidth = 0;
    let screenVideoHeight = 0;
    let screenControl;

    tabs.forEach(tab => tab.addEventListener('click', async () => {
      const view = tab.dataset.view;
      const terminal = view === 'terminal';
      tabs.forEach(item => { const active = item === tab; item.classList.toggle('active', active); item.setAttribute('aria-selected', active); });
      document.querySelector('#filesView').hidden = view !== 'files';
      document.querySelector('#terminalView').hidden = !terminal;
      document.querySelector('#screenView').hidden = view !== 'screen';
      if (terminal && adb) { try { await ensureTerminal(); } catch (error) { logError(error); } }
    }));
    connectButton.addEventListener('click', connect);
    disconnectButton.addEventListener('click', disconnect);
    listButton.addEventListener('click', listFiles);
    upButton.addEventListener('click', goUp);
    clearLogButton.addEventListener('click', () => { debugLog.textContent = '日志已清空'; });
    screenButton.onclick = startScreen;
    terminalHeight.addEventListener('input', () => {
      terminalHeightValue.textContent = `${terminalHeight.value}px`;
      terminalOutput.style.height = `${terminalHeight.value}px`;
      resizeTerminal();
    });

    async function connect() {
      if (!AdbDaemonWebUsbDeviceManager.BROWSER) return showStatus('当前浏览器不支持 WebUSB，请使用 Chrome / Edge。', true);
      connectButton.disabled = true;
      connectButton.textContent = '连接中…';
      showStatus('请在浏览器弹窗中选择设备并点击“连接”…');
      log('开始请求 WebUSB 设备');
      try {
        backend = await AdbDaemonWebUsbDeviceManager.BROWSER.requestDevice();
        if (!backend) throw new Error('未选择设备');
        log(`已选择设备：serial=${backend.serial || '(空)'}`);
        showStatus('设备已选择，正在打开 USB 通道…');
        const connection = await withTimeout(backend.connect(), 15000, '打开 USB 通道超时，请关闭电脑上的 adb server、Android Studio 或 scrcpy 后重试');
        log('USB 通道已打开');
        const credentialStore = new AdbWebCredentialStore('AndroidResourceAssistant-WebUSB-v2');
        showStatus('正在验证 ADB 授权并建立连接…');
        log('开始 ADB authenticate；已授权设备通常不会弹手机提示');
        const transport = await withTimeout(AdbDaemonTransport.authenticate({ serial: backend.serial, connection, credentialStore }), 30000, 'ADB 握手超时，请确认 adb server 已停止，并重新插拔 USB 后重试');
        log('ADB authenticate 成功');
        adb = new Adb(transport);
      setConnected(true);
      screenButton.disabled = false;
        connectButton.textContent = '已连接';
        showStatus(`已连接：${backend.serial || 'Android 设备'}`);
        log('ADB 设备对象已创建，开始列出 /sdcard');
        await listFiles();
      } catch (error) { logError(error); showStatus(`连接失败：${error.message}`, true); connectButton.disabled = false; connectButton.textContent = '连接 Android 设备'; }
    }

    async function disconnect() {
      await stopScreen();
      try { await terminalWriter?.close?.(); } catch {}
      try { await terminalProcess?.kill?.(); } catch {}
      terminal = undefined; terminalProcess = undefined; terminalWriter = undefined;
      try { await adb?.transport?.close?.(); } catch {}
      log('已请求断开 ADB 连接');
      adb = undefined; backend = undefined; setConnected(false); connectButton.textContent = '连接 Android 设备'; showStatus('已断开');
    }

    async function runShell(command) {
      if (!adb) throw new Error('请先连接设备');
      if (adb.subprocess.shellProtocol) return adb.subprocess.shellProtocol.spawnWaitText(command);
      return { stdout: await adb.subprocess.noneProtocol.spawnWaitText(command), stderr: '', exitCode: 0 };
    }

    async function listFiles() {
      if (!adb) return;
      revokePreviewUrl();
      listButton.disabled = true;
      try {
        const path = normalizePath(pathInput.value);
        pathInput.value = path;
        currentPath.textContent = path;
        log(`读取目录：${path}`);
        const sync = await adb.sync();
        try {
          const entries = await sync.readdir(path);
          renderFiles(path, entries);
        } finally { await sync.dispose(); }
      } catch (error) { logError(error); fileOutput.className = 'error'; fileOutput.textContent = error.message; }
      finally { listButton.disabled = false; }
    }

    function renderFiles(path, entries) {
      const sorted = entries.sort((a, b) => {
        const aDir = isDirectory(a); const bDir = isDirectory(b);
        return aDir === bDir ? a.name.localeCompare(b.name) : aDir ? -1 : 1;
      });
      fileOutput.className = 'file-list';
      fileOutput.innerHTML = '<div class="file-row header"><span>名称</span><span>类型</span><span>修改时间</span><span>大小</span><span></span></div>';
      if (!sorted.length) { fileOutput.innerHTML += '<div class="empty">目录为空</div>'; return; }
      sorted.forEach(entry => {
        const directory = isDirectory(entry);
        const row = document.createElement('div'); row.className = 'file-row';
        const name = document.createElement(directory ? 'button' : 'span');
        name.className = directory ? 'file-link' : 'file-name'; name.textContent = `${directory ? '📁 ' : '📄 '}${entry.name}`;
        if (directory) name.addEventListener('click', () => openDirectory(joinPath(path, entry.name)));
        const type = document.createElement('span'); type.textContent = directory ? '文件夹' : '文件';
        const mtime = document.createElement('span'); mtime.textContent = formatTime(entry.mtime);
        const size = document.createElement('span'); size.textContent = directory ? '—' : formatSize(entry.size);
        row.append(name, type, mtime, size);
        if (!directory) {
          const actions = document.createElement('div'); actions.className = 'file-actions';
          if (Number(entry.size) <= 1024 * 1024) {
            const view = document.createElement('button'); view.className = 'file-action'; view.textContent = '查看';
            view.addEventListener('click', () => previewFile(joinPath(path, entry.name), entry.name)); actions.append(view);
          }
          const download = document.createElement('button'); download.className = 'file-action'; download.textContent = '下载';
          download.addEventListener('click', () => downloadFile(joinPath(path, entry.name), entry.name, download)); actions.append(download); row.append(actions);
        }
        fileOutput.append(row);
      });
    }

    async function openDirectory(path) { pathInput.value = path; await listFiles(); }
    async function goUp() {
      const path = normalizePath(pathInput.value);
      if (path === '/') return;
      await openDirectory(path.slice(0, path.lastIndexOf('/')) || '/');
    }

    async function previewFile(path, name) {
      try {
        const bytes = await readRemoteFile(path);
        const extension = name.split('.').pop()?.toLowerCase() || '';
        const mime = getMimeType(extension);
        const binaryPreview = mime.startsWith('image/') || mime === 'application/pdf' || mime.startsWith('audio/') || mime.startsWith('video/');
        fileOutput.className = binaryPreview ? 'file-preview' : 'file-list';
        fileOutput.replaceChildren();
        const pathbar = document.createElement('div'); pathbar.className = 'pathbar';
        const back = document.createElement('button'); back.className = 'secondary'; back.textContent = '← 返回目录'; back.addEventListener('click', listFiles);
        const title = document.createElement('span'); title.textContent = name; pathbar.append(back, title); fileOutput.append(pathbar);
        if (mime.startsWith('image/') || mime === 'application/pdf' || mime.startsWith('audio/') || mime.startsWith('video/')) {
          previewUrl = URL.createObjectURL(new Blob([bytes], { type: mime }));
          const element = mime.startsWith('image/') ? document.createElement('img') : mime === 'application/pdf' ? document.createElement('iframe') : mime.startsWith('audio/') ? document.createElement('audio') : document.createElement('video');
          element.src = previewUrl; element.controls = true; element.alt = name; fileOutput.append(element);
        } else if (isTextFile(extension)) {
          const pre = document.createElement('pre'); let content = new TextDecoder().decode(bytes);
          if (extension === 'json') { try { content = JSON.stringify(JSON.parse(content), null, 2); } catch {} }
          pre.textContent = content; fileOutput.append(pre);
        } else {
          const message = document.createElement('div'); message.className = 'empty'; message.textContent = '该格式不适合直接预览，请使用“下载”保存到电脑后打开。'; fileOutput.append(message);
        }
      } catch (error) { logError(error); fileOutput.className = 'empty error'; fileOutput.textContent = `无法读取文件：${error.message}`; }
    }

    async function downloadFile(path, name, button) {
      button.disabled = true;
      try {
        log(`下载文件：${path}`);
        const bytes = await readRemoteFile(path);
        const url = URL.createObjectURL(new Blob([bytes], { type: 'application/octet-stream' }));
        const link = document.createElement('a'); link.href = url; link.download = name; link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (error) { logError(error); showStatus(`下载失败：${error.message}`, true); }
      finally { button.disabled = false; }
    }

    async function readRemoteFile(path) {
      const sync = await adb.sync();
      try {
        const reader = sync.read(path).getReader(); const chunks = []; let total = 0;
        while (true) { const part = await reader.read(); if (part.done) break; chunks.push(part.value); total += part.value.byteLength; }
        const bytes = new Uint8Array(total); let offset = 0;
        chunks.forEach(chunk => { bytes.set(chunk, offset); offset += chunk.byteLength; });
        return bytes;
      } finally { await sync.dispose(); }
    }

    function isDirectory(entry) { return String(entry.type).toLowerCase().includes('directory') || (Number(entry.mode) & 0o170000) === 0o040000; }
    function normalizePath(path) { const value = (path || '/sdcard').trim(); return `/${value.replace(/^\/+|\/+$/g, '')}`.replace('//', '/') || '/'; }
    function joinPath(parent, name) { return `${parent.replace(/\/$/, '')}/${name}`; }
    function formatSize(size) { const value = Number(size); if (!Number.isFinite(value)) return String(size); if (value < 1024) return `${value} B`; if (value < 1024 ** 2) return `${(value / 1024).toFixed(1)} KB`; return `${(value / 1024 ** 2).toFixed(1)} MB`; }
    function formatTime(seconds) { const value = Number(seconds); return Number.isFinite(value) && value > 0 ? new Date(value * 1000).toLocaleString() : '—'; }
    function isTextFile(extension) { return ['txt', 'log', 'json', 'xml', 'html', 'htm', 'css', 'js', 'ts', 'kt', 'java', 'properties', 'ini', 'yaml', 'yml', 'md', 'csv', 'sql', 'sh', 'conf'].includes(extension); }
    function getMimeType(extension) { const types = { png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif', webp:'image/webp', bmp:'image/bmp', svg:'image/svg+xml', pdf:'application/pdf', mp3:'audio/mpeg', wav:'audio/wav', ogg:'audio/ogg', mp4:'video/mp4', webm:'video/webm', mov:'video/quicktime' }; return types[extension] || 'application/octet-stream'; }
    function revokePreviewUrl() { if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = undefined; } }

    async function ensureTerminal() {
      if (terminalWriter) return;
      if (!adb) throw new Error('请先连接设备');
      if (!window.Terminal) throw new Error('终端组件加载失败，请检查网络后刷新页面');
      terminalOutput.replaceChildren();
      terminal = new Terminal({ convertEol: true, cursorBlink: true, fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace', theme: { background: '#111827', foreground: '#d1fae5' } });
      if (!window.FitAddon?.FitAddon) throw new Error('终端尺寸组件加载失败，请检查网络后刷新页面');
      fitAddon = new FitAddon.FitAddon();
      terminal.loadAddon(fitAddon);
      terminal.open(terminalOutput);
      terminalOutput.style.height = `${terminalHeight.value}px`;
      fitAddon.fit();
      const service = adb.subprocess.shellProtocol;
      terminalProcess = service ? await service.pty({ terminalType: 'xterm-256color' }) : await adb.subprocess.noneProtocol.pty();
      terminalWriter = terminalProcess.input.getWriter();
      log(`持久化终端已启动：${service ? 'shell protocol PTY' : 'none protocol PTY'}`);
      terminal.onData(data => { if (terminalWriter) terminalWriter.write(new TextEncoder().encode(data)).catch(logError); });
      readTerminalOutput(terminalProcess.output);
    }

    function resizeTerminal() {
      if (!terminal || !fitAddon) return;
      fitAddon.fit();
      terminalProcess?.resize?.(terminal.rows, terminal.cols);
    }

    async function readTerminalOutput(stream) {
      const reader = stream.getReader(); const decoder = new TextDecoder();
      try { while (true) { const part = await reader.read(); if (part.done) break; terminal?.write(decoder.decode(part.value, { stream: true })); } }
      catch (error) { logError(error); }
    }

    function consumeScrcpyOutput(client) {
      if (!client?.output?.pipeTo) return;
      void client.output.pipeTo(new WritableStream({
        write(chunk) {
          const text = typeof chunk === 'string' ? chunk : new TextDecoder().decode(chunk);
          if (text.trim()) log(`scrcpy server：${text.trim()}`);
        },
      })).catch(error => logError(error));
    }

    function androidButtons(buttons) {
      if (!screenControl) return 0;
      let value = 0;
      if (buttons & 1) value |= screenControl.AndroidMotionEventButton.Primary;
      if (buttons & 2) value |= screenControl.AndroidMotionEventButton.Secondary;
      if (buttons & 4) value |= screenControl.AndroidMotionEventButton.Tertiary;
      return value;
    }

    function screenPointerEvent(event) {
      if (event.type !== 'pointermove') log(`收到网页手势：${event.type}`);
      event.preventDefault();
      event.stopPropagation();
      const target = event.currentTarget;
      const canvas = screenOutput.querySelector('canvas');
      if (!canvas) return;
      const videoWidth = screenVideoWidth || canvas.width;
      const videoHeight = screenVideoHeight || canvas.height;
      if (!screenControl || !scrcpyClient?.controller || !videoWidth || !videoHeight) {
        if (event.type !== 'pointermove') log(`手势未发送：control=${Boolean(screenControl)} controller=${Boolean(scrcpyClient?.controller)} size=${videoWidth}×${videoHeight}`);
        return;
      }
      if (event.type === 'pointerdown') { target.setPointerCapture(event.pointerId); canvas.focus(); }
      const rect = canvas.getBoundingClientRect();
      const x = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
      const y = Math.max(0, Math.min(1, (event.clientY - rect.top) / rect.height));
      const action = event.type === 'pointerdown'
        ? screenControl.AndroidMotionEventAction.Down
        : event.type === 'pointerup'
          ? screenControl.AndroidMotionEventAction.Up
          : event.type === 'pointercancel'
            ? screenControl.AndroidMotionEventAction.Cancel
          : screenControl.AndroidMotionEventAction.Move;
      void scrcpyClient.controller.injectTouch({
        action,
        pointerId: BigInt(event.pointerId),
        pointerX: x * videoWidth,
        pointerY: y * videoHeight,
        videoWidth,
        videoHeight,
        pressure: event.buttons ? 1 : 0,
        actionButton: event.button === 0 ? screenControl.AndroidMotionEventButton.Primary : screenControl.AndroidMotionEventButton.None,
        buttons: androidButtons(event.buttons),
      }).then(() => {
        if (event.type !== 'pointermove') log(`已发送触摸事件：${event.type}`);
      }).catch(error => logError(error));
    }

    function screenKeyEvent(event) {
      if (!screenControl || !scrcpyClient?.controller) return;
      const keyCode = screenControl.AndroidKeyCode[event.code];
      if (keyCode === undefined) return;
      event.preventDefault();
      event.stopPropagation();
      let metaState = screenControl.AndroidKeyEventMeta.None;
      if (event.shiftKey) metaState |= screenControl.AndroidKeyEventMeta.Shift;
      if (event.ctrlKey) metaState |= screenControl.AndroidKeyEventMeta.Ctrl;
      if (event.altKey) metaState |= screenControl.AndroidKeyEventMeta.Alt;
      if (event.metaKey) metaState |= screenControl.AndroidKeyEventMeta.Meta;
      void scrcpyClient.controller.injectKeyCode({
        action: event.type === 'keydown' ? screenControl.AndroidKeyEventAction.Down : screenControl.AndroidKeyEventAction.Up,
        keyCode,
        repeat: event.repeat ? 1 : 0,
        metaState,
      }).then(() => log(`已发送按键事件：${event.code}`)).catch(error => logError(error));
    }

    async function startScreen() {
      if (!adb || scrcpyClient) return;
      if (location.protocol === 'file:') { screenStatus.textContent = '投屏需要通过 localhost 或 HTTPS 打开'; log('投屏停止：当前是 file://，无法读取同目录 scrcpy server'); return; }
      if (!window.VideoDecoder) { screenStatus.textContent = '当前浏览器不支持 WebCodecs'; return; }
      screenButton.disabled = true;
      screenStatus.textContent = '正在加载投屏组件…';
      log('开始初始化 scrcpy 投屏');
      try {
        const loadModule = async (path, label) => {
          log(`加载本地模块：${label}`);
          const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error(`${label} 加载超时`)), 15000));
          const module = await Promise.race([import(path), timeout]);
          log(`本地模块已加载：${label}`);
          return module;
        };
        const { AdbScrcpyClient, AdbScrcpyOptions3_3_3 } = await loadModule('./vendor/adb-scrcpy.js?v=2.3.2', 'adb-scrcpy');
        screenControl = await loadModule('./vendor/scrcpy.js?v=2.3.2', 'scrcpy control');
        const { WebCodecsVideoDecoder } = await loadModule('./vendor/scrcpy-decoder-webcodecs.js?v=2.5.3', 'scrcpy decoder');
        if (!AdbScrcpyOptions3_3_3) throw new Error('当前 scrcpy 库未提供 3.3.3 选项');
        const serverPath = '/data/local/tmp/scrcpy-server.jar';
        screenStatus.textContent = '正在下载并推送 scrcpy server…';
        log('开始读取本地 scrcpy server');
        const response = await fetch('./scrcpy-server-v3.3.3');
        if (!response.ok || !response.body) throw new Error(`scrcpy server 下载失败：HTTP ${response.status}`);
        log('开始推送 scrcpy server 到设备');
        await AdbScrcpyClient.pushServer(adb, response.body, serverPath);
        log('scrcpy server 推送完成，开始启动');
        screenStatus.textContent = '正在启动设备投屏…';
        scrcpyClient = await AdbScrcpyClient.start(adb, serverPath, new AdbScrcpyOptions3_3_3({
          audio: false,
          control: true,
          tunnelForward: true,
        }));
        log(`控制通道：${scrcpyClient.controller ? '已建立' : '未建立'}`);
        consumeScrcpyOutput(scrcpyClient);
        const video = await scrcpyClient.videoStream;
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d', { alpha: false });
        const renderer = {
          canvas,
          setSize(width, height) {
            canvas.width = width;
            canvas.height = height;
          },
          async draw(frame) {
            context.drawImage(frame, 0, 0, canvas.width, canvas.height);
          },
        };
        screenVideoWidth = video.metadata.width || scrcpyClient.videoWidth || 0;
        screenVideoHeight = video.metadata.height || scrcpyClient.videoHeight || 0;
        screenDecoder = new WebCodecsVideoDecoder({ codec: video.metadata.codec, renderer });
        screenDecoder.sizeChanged(({ width, height }) => {
          screenVideoWidth = width;
          screenVideoHeight = height;
          renderer.canvas.style.aspectRatio = `${width} / ${height}`;
          screenStatus.textContent = `投屏中 · ${width}×${height}`;
        });
        renderer.canvas.tabIndex = 0;
        renderer.canvas.style.touchAction = 'none';
        renderer.canvas.style.touchAction = 'none';
        screenOutput.onpointerdown = screenPointerEvent;
        screenOutput.onpointermove = screenPointerEvent;
        screenOutput.onpointerup = screenPointerEvent;
        screenOutput.onpointercancel = screenPointerEvent;
        renderer.canvas.onkeydown = screenKeyEvent;
        renderer.canvas.onkeyup = screenKeyEvent;
        screenOutput.replaceChildren(renderer.canvas);
        screenStatus.textContent = `投屏中 · ${video.metadata.width || '?'}×${video.metadata.height || '?'}`;
        log(`投屏已启动：${video.metadata.codec}`);
        void video.stream.pipeTo(screenDecoder.writable).catch(error => { logError(error); screenStatus.textContent = `投屏中断：${error.message}`; });
        screenButton.textContent = '停止投屏'; screenButton.disabled = false; screenButton.onclick = stopScreen;
      } catch (error) {
        const serverOutput = Array.isArray(error?.output) ? error.output.join('') : '';
        if (serverOutput.trim()) log(`scrcpy server 输出：\n${serverOutput.trim()}`);
        try { await scrcpyClient?.close?.(); } catch (closeError) { logError(closeError); }
        scrcpyClient = undefined;
        logError(error);
        screenStatus.textContent = `投屏失败：${error.message}`;
        screenButton.disabled = false;
      }
    }

    async function stopScreen() {
      try { await scrcpyClient?.close?.(); } catch (error) { logError(error); }
      try { screenDecoder?.dispose?.(); } catch {}
      scrcpyClient = undefined; screenDecoder = undefined;
      screenOutput.onpointerdown = null;
      screenOutput.onpointermove = null;
      screenOutput.onpointerup = null;
      screenOutput.onpointercancel = null;
      screenOutput.textContent = '投屏画面会显示在这里'; screenStatus.textContent = adb ? '已停止投屏' : '连接设备后开始投屏';
      screenButton.textContent = '开始投屏'; screenButton.onclick = startScreen; screenButton.disabled = !adb;
    }

    function setConnected(connected) {
      connectButton.disabled = connected;
      disconnectButton.disabled = !connected;
      listButton.disabled = !connected;
      upButton.disabled = !connected;
      screenButton.disabled = !connected;
    }
    function showStatus(message, error = false) { status.textContent = message; status.classList.toggle('error', error); }
    function log(message) {
      const time = new Date().toLocaleTimeString();
      if (debugLog.textContent === '等待操作…' || debugLog.textContent === '日志已清空') debugLog.textContent = '';
      debugLog.textContent += `[${time}] ${message}\n`;
      debugLog.scrollTop = debugLog.scrollHeight;
    }
    function logError(error) { log(`ERROR: ${error?.stack || error?.message || error}`); }
    function escapeHtml(value) { const div = document.createElement('div'); div.textContent = value; return div.innerHTML; }
    function withTimeout(promise, milliseconds, message) {
      let timer;
      const timeout = new Promise((_, reject) => { timer = setTimeout(() => reject(new Error(message)), milliseconds); });
      return Promise.race([promise.finally(() => clearTimeout(timer)), timeout]);
    }
    function shellQuote(value) { return `'${value.replaceAll("'", "'\\''")}'`; }
  </script>
</body>
</html>
