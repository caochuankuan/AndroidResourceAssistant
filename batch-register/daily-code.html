<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>每日密码</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; color: #17202a; background: radial-gradient(circle at 15% 15%, rgba(134, 190, 157, .28), transparent 30rem), #f5f6f1; font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    main { width: min(480px, calc(100% - 32px)); padding: 42px 28px; text-align: center; background: rgba(255, 255, 255, .86); border: 1px solid #d8dfda; border-radius: 20px; box-shadow: 0 20px 60px rgba(32, 45, 39, .1); }
    p { margin: 0 0 15px; color: #738079; font-size: 13px; letter-spacing: .08em; }
    output { display: block; color: #126c53; font: 700 clamp(36px, 11vw, 58px) ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .1em; overflow-wrap: anywhere; }
    time { display: block; margin-top: 20px; color: #8a948e; font-size: 12px; }
    .control { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 28px; padding: 16px 18px; text-align: left; background: #f2f6f3; border: 1px solid #d8e2db; border-radius: 14px; }
    .control strong, .control small { display: block; }
    .control strong { font-size: 14px; }
    .control small { margin-top: 4px; color: #738079; font-size: 12px; }
    .switch { position: relative; flex: 0 0 auto; width: 52px; height: 30px; }
    .switch input { position: absolute; opacity: 0; pointer-events: none; }
    .switch span { position: absolute; inset: 0; cursor: pointer; background: #b8c1bc; border-radius: 30px; transition: .2s; }
    .switch span::after { content: ''; position: absolute; width: 24px; height: 24px; top: 3px; left: 3px; background: #fff; border-radius: 50%; box-shadow: 0 2px 7px rgba(0, 0, 0, .2); transition: .2s; }
    .switch input:checked + span { background: #16775b; }
    .switch input:checked + span::after { transform: translateX(22px); }
    .switch input:disabled + span { cursor: wait; opacity: .55; }
  </style>
</head>
<body>
  <main>
    <p>今日访问密码</p>
    <output id="dailyCode">--------</output>
    <time id="chinaDate"></time>
    <section class="control">
      <div>
        <strong>批量注册入口</strong>
        <small id="switchStatus">读取状态中</small>
      </div>
      <label class="switch" title="允许或禁止进入批量注册页面">
        <input id="entranceSwitch" type="checkbox" disabled>
        <span></span>
      </label>
    </section>
  </main>
  <script src="access-code.js"></script>
  <script>
    function renderCode() {
      const parts = getChinaDateParts();
      document.getElementById('dailyCode').textContent = getDailyAccessCode();
      document.getElementById('chinaDate').textContent = `北京时间 ${parts.year}-${parts.month}-${parts.day}`;
    }

    const entranceSwitch = document.getElementById('entranceSwitch');
    const switchStatus = document.getElementById('switchStatus');

    function renderSwitch(enabled) {
      entranceSwitch.checked = enabled;
      switchStatus.textContent = enabled ? '当前允许访问' : '当前禁止访问';
    }

    async function loadSwitch() {
      try {
        const response = await fetch('/internal/batch-register-switch', { cache: 'no-store' });
        const result = await response.json();
        renderSwitch(result.enabled === true);
        entranceSwitch.disabled = false;
      } catch {
        switchStatus.textContent = '状态读取失败';
      }
    }

    entranceSwitch.addEventListener('change', async () => {
      const enabled = entranceSwitch.checked;
      entranceSwitch.disabled = true;
      switchStatus.textContent = '正在保存';
      try {
        const response = await fetch(`/internal/batch-register-switch?enabled=${enabled ? '1' : '0'}`, { method: 'POST' });
        if (!response.ok) throw new Error('保存失败');
        const result = await response.json();
        renderSwitch(result.enabled === true);
      } catch {
        renderSwitch(!enabled);
        switchStatus.textContent = '保存失败，请重试';
      } finally {
        entranceSwitch.disabled = false;
      }
    });

    renderCode();
    loadSwitch();
    setInterval(renderCode, 30000);
  </script>
</body>
</html>
